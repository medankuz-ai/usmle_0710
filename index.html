<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USMLE Vocabulary — интервальное повторение</title>
<style>
:root {
  color-scheme: light dark;
  --bg:#f5f7fb; --card:#ffffff; --text:#172033; --muted:#687287;
  --border:#dfe4ee; --accent:#315efb; --accent2:#eef2ff;
  --good:#18794e; --warn:#a15c00; --bad:#b42318;
}
@media (prefers-color-scheme:dark) {
  :root { --bg:#11151d; --card:#1a202b; --text:#eef2f7; --muted:#aab3c2;
  --border:#303949; --accent:#8ea7ff; --accent2:#222b46; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:820px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:clamp(26px,4vw,38px);margin:0 0 8px}
.sub{color:var(--muted);line-height:1.5;margin-bottom:20px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin:14px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{text-align:center;padding:12px 8px;border:1px solid var(--border);border-radius:14px}
.stat b{font-size:22px;display:block}
.stat span{font-size:12px;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
select,button{font:inherit;border-radius:12px;border:1px solid var(--border);padding:12px 14px}
select{width:100%;background:var(--card);color:var(--text)}
button{cursor:pointer;background:var(--card);color:var(--text)}
button.primary{background:var(--accent);color:white;border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.progress-wrap{height:8px;background:var(--border);border-radius:999px;overflow:hidden;margin-top:14px}
.progress{height:100%;width:0;background:var(--accent);transition:width .2s}
.study{text-align:center;padding:30px 20px}
.meta{color:var(--muted);font-size:13px;margin-bottom:16px}
.prompt{font-size:clamp(28px,5vw,44px);font-weight:700;line-height:1.18;min-height:110px;display:flex;align-items:center;justify-content:center}
.answer{font-size:22px;line-height:1.45;margin:8px auto 18px;max-width:650px}
.rating-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.rating-grid button{min-height:54px}
.small{font-size:12px;color:var(--muted);display:block;margin-top:3px}
.hidden{display:none!important}
.notice{font-size:13px;color:var(--muted);line-height:1.45}
.footer{font-size:12px;color:var(--muted);margin-top:22px}
@media(max-width:600px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .controls{grid-template-columns:1fr}
 .rating-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<main>
  <h1>USMLE Vocabulary</h1>
  <div class="sub" id="summary">Интервальное повторение всех Quizlet-наборов.</div>

  <section class="panel">
    <div class="stats">
      <div class="stat"><b id="totalStat">343</b><span>всего карточек</span></div>
      <div class="stat"><b id="cycleStat">0/343</b><span>в текущем цикле</span></div>
      <div class="stat"><b id="dueStat">0</b><span>к повторению</span></div>
      <div class="stat"><b id="masteredStat">0</b><span>освоено</span></div>
    </div>
  </section>

  <section class="panel" id="setupPanel">
    <div class="controls">
      <div>
        <label for="newLimit">Новых карточек за день</label>
        <select id="newLimit">
          <option value="15">15</option>
          <option value="20">20</option>
          <option value="30" selected>30</option>
          <option value="40">40</option>
          <option value="50">50</option>
        </select>
      </div>
      <div>
        <label for="direction">Направление</label>
        <select id="direction">
          <option value="mixed" selected>Смешанное EN ↔ RU</option>
          <option value="enru">English → Русский</option>
          <option value="ruen">Русский → English</option>
        </select>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="startBtn" type="button">Начать повторение</button>
      <button id="resetBtn" type="button">Сбросить прогресс</button>
    </div>
    <div class="notice" id="queueInfo" style="margin-top:12px"></div>
  </section>

  <section class="panel study hidden" id="studyPanel">
    <div class="meta" id="meta"></div>
    <div class="prompt" id="prompt"></div>
    <div class="answer hidden" id="answer"></div>
    <button class="primary" id="showBtn" type="button">Показать ответ</button>
    <div class="rating-grid hidden" id="ratings">
      <button type="button" data-rate="again">Снова<span class="small">сегодня</span></button>
      <button type="button" data-rate="hard">Трудно<span class="small">≈ 1 день</span></button>
      <button type="button" data-rate="good">Хорошо<span class="small">интервал ↑</span></button>
      <button type="button" data-rate="easy">Легко<span class="small">интервал ↑↑</span></button>
    </div>
    <div class="progress-wrap"><div class="progress" id="progress"></div></div>
  </section>

  <section class="panel hidden" id="donePanel">
    <h2 style="margin-top:0">Сессия завершена</h2>
    <p id="doneText"></p>
    <button class="primary" id="againBtn" type="button">Обновить очередь</button>
  </section>

  <div class="footer">
    Прогресс хранится только в этом браузере через localStorage. Все карточки гарантированно проходят через очередь до начала нового полного цикла.
  </div>
</main>

// Interleave tiers so lower-frequency cards cannot be starved.
function buildCycle(){
  const groups={

    C:BANK.filter(x=>x.tier==="C")

  const pattern=["A","A","B","A","B","C"];
  while(idx.A<groups.A.length||idx.B<groups.B.length||idx.C<groups.C.length){

    for(const g of pattern){
      if(idx[g]<groups[g].length){out.push(groups[g][idx[g]++]);added=true;}

    if(!added) break;
  }
  const seen=new Set();
  return out.filter(c=>{const k=String(c.id);if(seen.has(k))return false;seen.add(k);return true;});
}

  while(need>0){
    let remaining=CYCLE.filter(c=>!state.cycleSeen.includes(String(c.id)));
    if(remaining.length===0){
      state.cycleSeen=[];
      state.cycleNo+=1;
      remaining=[...CYCLE];
    }
    const take=remaining.slice(0,need);
    if(take.length===0) break;
    for(const c of take){
      const id=String(c.id);
      if(!state.todayNew.includes(id)) state.todayNew.push(id);
      if(!state.cycleSeen.includes(id)) state.cycleSeen.push(id);
    }
    need=Math.max(0,limit-state.todayNew.length);
  }
  save();
}

function updateStats(){
  const now=Date.now();
  let due=0,mastered=0,learned=0;
  for(const c of BANK){
    const s=cs(c);
    if(s.reps>0) learned++;
    if(s.reps>0&&s.due<=now) due++;
    if(s.mastered) mastered++;
  }
  els.total.textContent=BANK.length;
  els.cycle.textContent=state.cycleSeen.length+"/"+BANK.length;
  els.due.textContent=due;
  els.mastered.textContent=mastered;
  els.summary.textContent="Всего "+BANK.length+" карточек из всех Quizlet. Полный цикл "+state.cycleNo+
    ": "+state.cycleSeen.length+"/"+BANK.length+" уже поставлены в очередь. Освоено хотя бы один раз: "+learned+".";
  els.queueInfo.textContent="Сначала показываются карточки, срок повторения которых наступил, затем новые. Пока все "+BANK.length+
    " карточек не попадут в очередь, новый полный цикл не начнётся.";
  save();
}

let queue=[],current=null,totalSession=0,doneSession=0,mix=false;
function prepareQueue(){
  const limit=Number(els.newLimit.value)||30;
  ensureTodayNew(limit);
  const now=Date.now();
  const due=BANK.filter(c=>{const s=cs(c);return s.reps>0&&s.due<=now;})
    .sort((a,b)=>cs(a).due-cs(b).due);
  const today=state.todayNew
    .map(id=>BANK.find(c=>String(c.id)===String(id)))
    .filter(Boolean)
    .filter(c=>cs(c).reps===0);
  const used=new Set();
  queue=[...due,...today].filter(c=>{const id=String(c.id);if(used.has(id))return false;used.add(id);return true;});
  totalSession=queue.length;doneSession=0;
}
function direction(){
  const d=els.direction.value;
  if(d!=="mixed") return d;
  mix=!mix;return mix?"enru":"ruen";
}
function showNext(){
  if(queue.length===0){
    current=null;els.study.classList.add("hidden");els.done.classList.remove("hidden");
    els.doneText.textContent="Пройдено карточек в этой сессии: "+doneSession+
      ". Полный цикл: "+state.cycleSeen.length+"/"+BANK.length+".";
    updateStats();return;
  }
  current=queue.shift();
  const d=direction(), s=cs(current);
  els.meta.textContent="Tier "+current.tier+" · повторений "+s.reps+" · интервал "+s.interval+" дн. · цикл "+state.cycleNo;
  els.prompt.textContent=d==="enru"?current.en:current.ru;
  els.answer.textContent=d==="enru"?current.ru:current.en;
  els.answer.classList.add("hidden");els.ratings.classList.add("hidden");els.show.classList.remove("hidden");
  els.progress.style.width=(totalSession?Math.round(doneSession/totalSession*100):0)+"%";
}
function rate(kind){
  if(!current)return;
  const s=cs(current),now=Date.now();
  s.reps+=1;
  if(kind==="again"){
    s.interval=0;s.due=now+10*60*1000;s.ease=Math.max(1.3,s.ease-0.2);queue.push(current);
  }else if(kind==="hard"){
    s.interval=s.interval<=1?1:Math.max(1,Math.round(s.interval*1.4));
    s.due=now+s.interval*DAY;s.ease=Math.max(1.3,s.ease-0.05);
  }else if(kind==="good"){
    s.interval=s.interval===0?3:Math.max(3,Math.round(s.interval*s.ease));
    s.due=now+s.interval*DAY;
  }else{
    s.interval=s.interval===0?7:Math.max(7,Math.round(s.interval*(s.ease+1)));
    s.due=now+s.interval*DAY;s.ease=Math.min(3.0,s.ease+0.1);
  }
  s.mastered=s.reps>=4&&s.interval>=21;
  doneSession+=1;save();updateStats();showNext();
}
function start(){
  prepareQueue();els.done.classList.add("hidden");
  if(queue.length===0){
    els.study.classList.add("hidden");els.done.classList.remove("hidden");
    els.doneText.textContent="На сегодня очередь пуста. Можно увеличить число новых карточек или вернуться позже.";
    return;
  }
  els.study.classList.remove("hidden");showNext();
}

els.start.addEventListener("click",start);
els.again.addEventListener("click",start);
els.show.addEventListener("click",()=>{
  els.answer.classList.remove("hidden");els.ratings.classList.remove("hidden");els.show.classList.add("hidden");
});
document.querySelectorAll("[data-rate]").forEach(b=>b.addEventListener("click",()=>rate(b.dataset.rate)));
els.reset.addEventListener("click",()=>{
  if(!confirm("Сбросить весь прогресс и начать с первого полного цикла?")) return;
  try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
  state=freshState();queue=[];current=null;els.study.classList.add("hidden");els.done.classList.add("hidden");updateStats();
});
updateStats();
</script>
</body>
